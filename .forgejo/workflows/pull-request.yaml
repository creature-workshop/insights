name: Pull Request

on:
  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/cache@v4
        with:
          path: |
            ~/.rustup/toolchains
            ~/.rustup/update-hashes
            ~/.rustup/settings.toml
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            target
          key: rust-${{ hashFiles('Cargo.lock', 'ops.lock') }}
          restore-keys: |
            rust-
      - run: shell/.ops/init --no-install
      - run: shell/action rust setup stable rustfmt clippy
      - run: shell/action rust lint

  security:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/cache@v4
        with:
          path: |
            ~/.rustup/toolchains
            ~/.rustup/update-hashes
            ~/.rustup/settings.toml
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            target
          key: rust-${{ hashFiles('Cargo.lock', 'ops.lock') }}
          restore-keys: |
            rust-
      - run: shell/.ops/init --no-install
      - run: shell/action rust setup
      - run: shell/action rust security

  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/cache@v4
        with:
          path: |
            ~/.rustup/toolchains
            ~/.rustup/update-hashes
            ~/.rustup/settings.toml
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            target
          key: rust-${{ hashFiles('Cargo.lock', 'ops.lock') }}
          restore-keys: |
            rust-
      - run: shell/.ops/init --no-install
      - run: shell/action rust setup
      - run: cargo test --no-default-features

  pr-hygiene:
    runs-on: ubuntu-22.04
    env:
      FORGEJO_PR_TOKEN: ${{ secrets.BLIZZ_PR_TOKEN }}
      FORGE_ADMIN_TOKEN: ${{ secrets.BLIZZ_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - run: shell/.ops/init --no-install
      - run: shell/ops pr-hygiene

  plan-version:
    needs: [pr-hygiene]
    runs-on: ubuntu-22.04
    env:
      FORGEJO_PR_TOKEN: ${{ secrets.BLIZZ_PR_TOKEN }}
      FORGE_ADMIN_TOKEN: ${{ secrets.BLIZZ_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
          ref: ${{ github.head_ref }}
      - run: shell/.ops/init --no-install
      - run: shell/action git config "Blizz" "blizz@kernelle-soft.com"
      - run: shell/action git auth "blizz" "${{ secrets.BLIZZ_TOKEN }}"
      - run: shell/ops plan-version
      - name: push-manifest
        run: |
          git diff --quiet manifest.json && exit 0
          shell/ops git-commit -a -m "chore: plan version [skip ci]"
          git push origin HEAD
