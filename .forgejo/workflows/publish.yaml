name: Publish Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: false
        type: choice
        default: 'auto'
        options:
          - auto
          - major
          - minor
          - patch
          - dev
          - alpha
          - beta
          - rc
          - release

jobs:
  lint:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/cache@v4
        with:
          path: |
            ~/.rustup/toolchains
            ~/.rustup/update-hashes
            ~/.rustup/settings.toml
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            target
          key: rust-${{ hashFiles('Cargo.lock', 'ops.lock') }}
          restore-keys: |
            rust-
      - run: shell/.ops/init --no-install
      - run: shell/action rust setup stable rustfmt clippy
      - run: cargo fmt --check
      - run: cargo clippy --no-default-features -- -D warnings

  security:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/cache@v4
        with:
          path: |
            ~/.rustup/toolchains
            ~/.rustup/update-hashes
            ~/.rustup/settings.toml
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            target
          key: rust-${{ hashFiles('Cargo.lock', 'ops.lock') }}
          restore-keys: |
            rust-
      - run: shell/.ops/init --no-install
      - run: shell/action rust setup
      - run: shell/action rust security

  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/cache@v4
        with:
          path: |
            ~/.rustup/toolchains
            ~/.rustup/update-hashes
            ~/.rustup/settings.toml
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            target
          key: rust-${{ hashFiles('Cargo.lock', 'ops.lock') }}
          restore-keys: |
            rust-
      - run: shell/.ops/init --no-install
      - run: shell/action rust setup
      - run: cargo test --no-default-features

  publish:
    needs: [lint, security, test]
    runs-on: ubuntu-22.04
    env:
      FORGE_ADMIN_TOKEN: ${{ secrets.BLIZZ_TOKEN }}
      LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
      - uses: actions/cache@v4
        with:
          path: |
            ~/.rustup/toolchains
            ~/.rustup/update-hashes
            ~/.rustup/settings.toml
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            ~/.zig
            target
          key: rust-${{ hashFiles('Cargo.lock', 'ops.lock') }}
          restore-keys: |
            rust-
      - run: shell/.ops/init --no-install
      - run: shell/action rust setup
      - run: shell/action git config "Blizz" "blizz@kernelle-soft.com"
      - run: shell/action git auth "blizz" "${{ secrets.BLIZZ_TOKEN }}"
      - run: shell/action forgejo sync-labels
      - name: bump-and-release
        run: |
          VERSION=$(shell/ops git-bump --dry-run) || { echo "No bump needed, skipping release."; exit 0; }
          shell/action git version-guard "v${VERSION}" || exit 0
          echo "$VERSION" > .version

          shell/ops sync-manifest "$VERSION"
          shell/scripts/sync_cargo_version.sh "$VERSION"
          shell/ops git-commit -a -m "chore: bump to v${VERSION} [skip ci]"
          git tag -a "v${VERSION}" -m "v${VERSION}"
          git push origin main "v${VERSION}"
      - name: build-release-binaries
        run: |
          [ -f .version ] || { echo 'No bump performed, skipping build.'; exit 0; }
          VERSION=$(cat .version)
          shell/ops install zig cargo-zigbuild
          shell/action rust build-release --bin insights --version "$VERSION" -- --no-default-features
      - name: publish-release
        run: |
          [ -f .version ] || { echo 'No bump performed, skipping release.'; exit 0; }
          shell/ops publish-release --artifacts ./dist/artifacts.json
      - name: publish-crate
        run: |
          [ -f .version ] || { echo 'No bump performed, skipping publish.'; exit 0; }
          cargo publish
      - name: update-homebrew-tap
        run: |
          [ -f .version ] || { echo 'No bump performed, skipping tap update.'; exit 0; }
          VERSION=$(cat .version)
          shell/action homebrew update-tap \
            --tap-repo "https://blizz:${{ secrets.BLIZZ_TOKEN }}@creature-workshop.kernelle-soft.com/kernelle-soft/homebrew-tap.git" \
            --asset-url "https://creature-workshop.kernelle-soft.com/kernelle-soft/insights/releases/download/v${VERSION}" \
            --asset-dir ./dist
      - run: shell/action linear close-mentioned-issues
