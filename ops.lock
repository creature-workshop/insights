{
  "system": {
    "shellcheck": { "version": "0.9.0" },
    "build-essential": { "version": "" }
  },
  "script": {
    "llvm-strip": {
      "version": "14"
    },
    "zig": {
      "version": "0.16.0",
      "needs": ["build-essential"]
    }
  },
  "cargo-install": {
    "cargo-zigbuild": {
      "version": "0.22.1",
      "needs": ["rustup"]
    }
  },
  "cargo-binstall": {
    "cargo-audit": {
      "version": "0.22.0",
      "args": "--locked --force",
      "needs": ["cargo-binstall"]
    }
  },
  "local": {
    "cargo-binstall": {
      "version": "latest"
    }
  }
}
