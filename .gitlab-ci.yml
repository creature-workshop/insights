include:
  - component: $CI_SERVER_FQDN/kernelle-soft/creatures/forge@0.15.0
  - component: $CI_SERVER_FQDN/kernelle-soft/creatures/linear@0.15.0
  - component: $CI_SERVER_FQDN/kernelle-soft/creatures/rust@0.15.0
    inputs:
      workspace: "false"
      threshold: "20"
      bins: "insights insights_server"
      cargo-flags: "--no-default-features"

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
